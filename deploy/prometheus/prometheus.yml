# Scrape Scout MCP and Prometheus itself; evaluate the alert rules.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: scout-mcp
    static_configs:
      - targets: ["scout-mcp:8080"]
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
