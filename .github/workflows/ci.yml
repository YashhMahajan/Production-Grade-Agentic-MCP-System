name: CI

on:
  push:
    branches: [main, ship-ready]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository. A job that needs more asks for it itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast checks. Everything here runs on a laptop with no Docker.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,copilot]"
      - run: ruff check src tests deploy scripts
      - run: pytest -q
      - name: Policy cases pass and every rule decides one
        run: scout-mcp policy test --strict
      - name: Request-overhead benchmark
        run: |
          python scripts/bench_pipeline.py 1000 | tee bench-pipeline.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("bench-pipeline.json"))
          print("### Request overhead (backend faked)\n")
          print(f"{d['machine']}, Python {d['python']}, {d['calls_per_scenario']} calls per row\n")
          print("| scenario | p50 ms | p95 ms |\n|---|---|---|")
          for k in ("healthz_no_auth", "tool_call_cache_miss", "tool_call_cache_hit"):
              print(f"| {k} | {d[k]['p50']:.2f} | {d[k]['p95']:.2f} |")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: bench-pipeline, path: bench-pipeline.json }

  # Static checks of everything in deploy/ that does not need a running stack.
  validate-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: cp .env.example .env
      - name: Compose file resolves
        run: docker compose config --quiet
      - name: Prometheus rules parse and their unit tests pass
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/p:ro" prom/prometheus:v2.53.0 check config /p/prometheus.yml || true
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/p:ro" prom/prometheus:v2.53.0 check rules /p/alerts.yml
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/p:ro" prom/prometheus:v2.53.0 test rules /p/alerts_test.yml
      - name: Caddyfile is valid
        run: docker run --rm -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Realm and dashboard are valid JSON
        run: |
          python3 -c "import json;json.load(open('deploy/keycloak/scout-realm.json'));json.load(open('deploy/grafana/dashboards/scout.json'))"
      - name: Dockerfile lint
        run: docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold error - < Dockerfile

  # The real thing: build the image, start all services, seed, run the end-to-end
  # tests, then measure against real backends.
  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: cp .env.example .env

      - name: Build
        run: docker compose build

      - name: Start every service and wait for health
        run: docker compose up -d --wait --wait-timeout 900

      - name: Service status and server startup log
        run: |
          docker compose ps
          echo "::group::scout-mcp startup log"
          docker compose logs --no-color --tail 60 scout-mcp
          echo "::endgroup::"

      - name: Seed demo data
        run: docker compose --profile seed run --rm seed

      - name: Ingest a document for acme into its own index and collection
        run: |
          docker compose --profile seed run --rm --entrypoint scout-mcp seed \
            ingest --tenant acme --collection ingest_demo --index ingest_demo /seed/sample/warranty.md
          # A second run of the same file must embed nothing.
          docker compose --profile seed run --rm --entrypoint scout-mcp seed \
            ingest --tenant acme --collection ingest_demo --index ingest_demo /seed/sample/warranty.md \
            | tee ingest-again.txt
          grep -q "0 chunks embedded; 1 unchanged and skipped" ingest-again.txt

      - name: End-to-end tests
        run: SCOUT_E2E=1 SCOUT_E2E_INGESTED=1 pytest tests/e2e -v --junitxml=e2e-results.xml

      - name: Raise rate limits so the benchmark measures the stack, not the limiter
        run: |
          SCOUT_RATE_LIMIT_DEFAULT_RPM=600000 SCOUT_RATE_LIMIT_BURST=100000 \
          SCOUT_RATE_LIMIT_PER_TOOL_OVERRIDES=false \
          docker compose up -d --wait --wait-timeout 300 scout-mcp

      - name: Benchmark with real backends
        run: |
          python scripts/bench_stack.py 200 10 | tee bench-stack.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("bench-stack.json"))
          print("### Real stack, through the TLS edge\n")
          print(f"{d['machine']}, {d['cpus']} CPUs (shared runner), {d['calls_per_scenario']} calls per row\n")
          print("| tool | miss p50 | miss p95 | hit p50 | hit p95 | cache speedup (p50) |\n|---|---|---|---|---|---|")
          for t in ("postgres.query", "customer.build_context", "semantic_search"):
              r = d[t]
              print(f"| {t} | {r['cache_miss']['p50_ms']} | {r['cache_miss']['p95_ms']} | {r['cache_hit']['p50_ms']} | {r['cache_hit']['p95_ms']} | {r['cache_speedup_p50']}x |")
          print("\n| concurrent run | workers | req/s | p50 ms | p95 ms | errors |\n|---|---|---|---|---|---|")
          for k in ("concurrent_cache_hits", "concurrent_cache_misses"):
              r = d[k]
              print(f"| {k} | {r['workers']} | {r['requests_per_second']} | {r['p50_ms']} | {r['p95_ms']} | {r['errors']} |")
          print(f"\nToken fetch from Keycloak, p50: {d['token_fetch_p50_ms']} ms")
          PY

      - name: Memory use per service after the run
        run: |
          docker stats --no-stream --format "table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}" | tee docker-stats.txt
          { echo '### Memory and CPU per container'; echo; echo '```'; cat docker-stats.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          docker images scout-mcp:dev --format "Image scout-mcp:dev is {{.Size}}" | tee -a docker-stats.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Logs on failure
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color --tail 300 > compose-logs.txt || true
          # Print the tail of anything that is not healthy, so the cause is in this log.
          for svc in $(docker compose ps -a --format '{{.Service}} {{.Health}} {{.State}}' | awk '$2!="healthy" && $3!="running" || $2=="unhealthy" {print $1}'); do
            echo "::group::logs for $svc"; docker compose logs --no-color --tail 60 "$svc" || true; echo "::endgroup::"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: stack-results
          path: |
            e2e-results.xml
            bench-stack.json
            docker-stats.txt
            compose-logs.txt
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose --profile seed --profile copilot down -v

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - name: Known vulnerabilities in Python dependencies
        run: |
          # setuptools 79 on the runner has three known advisories; it is a build tool,
          # not one of our dependencies, but audit a clean environment.
          pip install -U pip setuptools
          pip install -e ".[copilot]" pip-audit
          pip-audit --skip-editable
      # Trivy runs from its own pinned image. The setup action pinned a Trivy release
      # that had since been removed, and one fewer third-party action is one fewer thing to trust.
      - name: Dockerfile misconfiguration
        run: docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.76.2 config --severity HIGH,CRITICAL --exit-code 1 /src
      - name: Build the image
        run: docker build -t scout-mcp:scan .
      - name: Where the fixable findings live
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 \
            image --severity HIGH,CRITICAL --ignore-unfixed --format json scout-mcp:scan > trivy.json
          python3 - <<'PY'
          import json
          d = json.load(open("trivy.json"))
          rows = [(r["Target"], v["PkgName"], v["InstalledVersion"], v.get("FixedVersion", ""), v.get("PkgPath", ""))
                  for r in d.get("Results", []) for v in (r.get("Vulnerabilities") or [])]
          print(f"{len(rows)} fixable HIGH/CRITICAL finding(s)")
          for row in rows:
              print(" | ".join(row))
          PY
      - name: Image vulnerabilities (fail on any HIGH or CRITICAL that has a fix)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 scout-mcp:scan
      - name: Image vulnerability counts (informational)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 \
            image --severity HIGH,CRITICAL --ignore-unfixed --format table scout-mcp:scan | tee trivy-image.txt | tail -40 || true
      # The copilot image adds the agent framework. Scan it on its own, so its findings are not
      # hidden by, and do not leak into, the server image's.
      - name: Build the copilot image
        run: docker build --build-arg 'EXTRAS=[copilot]' -t scout-mcp-copilot:scan .
      - name: Copilot image vulnerabilities (fail on any HIGH or CRITICAL that has a fix)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 scout-mcp-copilot:scan
      - name: The server image does not contain the agent framework
        run: |
          if docker run --rm --entrypoint python scout-mcp:scan -c "import langgraph" 2>/dev/null; then
            echo "langgraph is in the server image"; exit 1
          fi
          docker run --rm --entrypoint python scout-mcp-copilot:scan -c "import langgraph, langchain_openai"

  # Credentials have reached git history before. This looks at the commits a pull request adds.
  secrets:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: No credentials in the commits this pull request adds
        env:
          BASE: ${{ github.base_ref }}
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            zricethezav/gitleaks:v8.30.0 git /repo --config /repo/.gitleaks.toml \
            --log-opts "origin/${BASE}..HEAD" --redact --exit-code 1
