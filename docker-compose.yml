# Full Scout MCP stack.
#
#   cp .env.example .env
#   docker compose up -d --build --wait
#   docker compose --profile seed run --rm seed        # demo data
#   docker compose --profile copilot run --rm copilot "Why was the refund on order o_9002 for CUST-1001 delayed?"
#
# Only these are reachable from the host, all on 127.0.0.1:
#   8443   Caddy, the TLS edge for /mcp and /approvals
#   8081   Keycloak (token endpoint)
#   3000   Grafana    9090  Prometheus    16686  Jaeger
# Postgres, Redis, Elasticsearch, Qdrant and the S3 store sit on an internal network with
# no route to the host. Reach them with `docker compose exec`.
#
# Every store requires credentials. The defaults below are for development only.

name: scout-mcp

networks:
  app: {}
  data:
    internal: true   # no route to or from the outside

services:
  # ── Edge ──────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: [ "127.0.0.1:8443:8443" ]
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data            # keeps the local CA stable across restarts
    networks: [ app ]
    depends_on:
      scout-mcp: { condition: service_healthy }
    read_only: true
    tmpfs: [ /config ]
    cap_drop: [ ALL ]
    # The caddy binary carries a file capability for low ports. With every capability
    # dropped the kernel refuses to exec it ("operation not permitted"), so keep this one.
    cap_add: [ NET_BIND_SERVICE ]
    security_opt: [ "no-new-privileges:true" ]
    mem_limit: 128m
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-check-certificate -q -O- https://localhost:8443/healthz" ]
      interval: 10s
      timeout: 3s
      retries: 10

  # ── Application ───────────────────────────────────────────────────────
  # Gets only the settings it needs. The LLM keys in .env stay out of this container.
  scout-mcp:
    build: .
    image: scout-mcp:dev
    restart: unless-stopped
    networks: [ app, data ]
    environment:
      SCOUT_TRANSPORT: http
      SCOUT_HTTP_HOST: 0.0.0.0
      SCOUT_HTTP_PORT: "8080"
      SCOUT_STATELESS_MODE: "true"
      SCOUT_AUTH_ISSUER: ${SCOUT_AUTH_ISSUER:-http://keycloak:8080/realms/scout}
      SCOUT_AUTH_AUDIENCE: ${SCOUT_AUTH_AUDIENCE:-scout-mcp}
      SCOUT_AUTH_JWKS_URL: ${SCOUT_AUTH_JWKS_URL:-http://keycloak:8080/realms/scout/protocol/openid-connect/certs}
      SCOUT_POLICY_DEFAULT_DENY: "true"
      SCOUT_POLICY_FILE: config/policy.yaml
      SCOUT_REDIS_URL: redis://:${REDIS_PASSWORD:-scout-dev-redis}@redis:6379/0
      SCOUT_OTEL_ENDPOINT: http://otel-collector:4317
      SCOUT_AUDIT_LOG_PATH: /var/log/scout/audit.jsonl
      SCOUT_POSTGRES_DSN: ${SCOUT_POSTGRES_DSN:-postgresql://scout_app:scout_app@postgres:5432/scout}
      SCOUT_ELASTICSEARCH_URL: http://elasticsearch:9200
      SCOUT_ELASTICSEARCH_PASSWORD: ${SCOUT_ELASTICSEARCH_PASSWORD:-scout-dev-es}
      SCOUT_VECTOR_DB_URL: http://qdrant:6333
      SCOUT_VECTOR_DB_API_KEY: ${SCOUT_VECTOR_DB_API_KEY:-scout-dev-qdrant}
      SCOUT_S3_ENDPOINT: http://s3:8333
      SCOUT_S3_BUCKET: scout-mcp-data
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-scoutaccess}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-scout-dev-s3-secret}
      AWS_DEFAULT_REGION: us-east-1
      SCOUT_EMBEDDING_MODEL: ${SCOUT_EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}
      SCOUT_RATE_LIMIT_DEFAULT_RPM: ${SCOUT_RATE_LIMIT_DEFAULT_RPM:-60}
      SCOUT_RATE_LIMIT_BURST: ${SCOUT_RATE_LIMIT_BURST:-20}
      SCOUT_RATE_LIMIT_PER_TOOL_OVERRIDES: ${SCOUT_RATE_LIMIT_PER_TOOL_OVERRIDES:-true}
      SCOUT_CACHE_L1_TTL_SECONDS: ${SCOUT_CACHE_L1_TTL_SECONDS:-60}
      SCOUT_CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${SCOUT_CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
      SCOUT_CIRCUIT_BREAKER_RECOVERY_SECONDS: ${SCOUT_CIRCUIT_BREAKER_RECOVERY_SECONDS:-30}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
      otel-collector: { condition: service_started }
    volumes:
      - scout-logs:/var/log/scout
      - ./config:/app/config:ro
    read_only: true
    tmpfs: [ /tmp ]
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    pids_limit: 256
    mem_limit: 1536m

  # One-shot: loads demo tickets and documents into Elasticsearch and Qdrant.
  seed:
    build: .
    image: scout-mcp:dev
    profiles: [ seed ]
    networks: [ data ]
    entrypoint: [ "python", "/seed/seed.py" ]
    environment:
      SCOUT_ELASTICSEARCH_URL: http://elasticsearch:9200
      SCOUT_ELASTICSEARCH_PASSWORD: ${SCOUT_ELASTICSEARCH_PASSWORD:-scout-dev-es}
      SCOUT_VECTOR_DB_URL: http://qdrant:6333
      SCOUT_VECTOR_DB_API_KEY: ${SCOUT_VECTOR_DB_API_KEY:-scout-dev-qdrant}
      SCOUT_EMBEDDING_MODEL: ${SCOUT_EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}
    volumes: [ "./deploy/seed:/seed:ro" ]
    depends_on:
      elasticsearch: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    restart: "no"

  # One-shot: the support copilot, run inside the stack so it needs no host TLS setup.
  #   docker compose --profile copilot run --rm copilot "your question"
  copilot:
    build: .
    image: scout-mcp:dev
    profiles: [ copilot ]
    networks: [ app ]
    entrypoint: [ "scout-copilot" ]
    environment:
      SCOUT_MCP_URL: http://scout-mcp:8080
      SCOUT_TOKEN_URL: http://keycloak:8080/realms/scout/protocol/openid-connect/token
      SCOUT_CLIENT_ID: ${SCOUT_CLIENT_ID:-copilot-acme}
      SCOUT_CLIENT_SECRET: ${SCOUT_CLIENT_SECRET:-dev-secret-copilot-acme}
      SCOUT_TENANT: ${SCOUT_TENANT:-acme}
      # The address clients use (the TLS edge), for the protected-resource metadata.
      SCOUT_PUBLIC_URL: ${SCOUT_PUBLIC_URL:-https://localhost:8443}
      SCOUT_LLM_API_KEY: ${SCOUT_LLM_API_KEY:-}
      SCOUT_LLM_MODEL: ${SCOUT_LLM_MODEL:-deepseek/deepseek-v4-flash:free}
      SCOUT_LLM_BASE_URL: ${SCOUT_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      SCOUT_LLM_FALLBACK: ${SCOUT_LLM_FALLBACK:-false}
      SCOUT_LLM_GROQ_KEY: ${SCOUT_LLM_GROQ_KEY:-}
    depends_on:
      scout-mcp: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    restart: "no"

  # ── Identity ──────────────────────────────────────────────────────────
  # start-dev: in-memory caches, plain HTTP. Fine for development; use `start` with
  # TLS and a fixed hostname in production. The issuer is pinned to keycloak:8080 so
  # tokens carry the same `iss` whether they were requested from the host or from
  # inside the network.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    restart: unless-stopped
    command: [ "start-dev", "--import-realm" ]
    ports: [ "127.0.0.1:8081:8080" ]
    networks: [ app, data ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HOSTNAME: http://keycloak:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak/scout-realm.json:/opt/keycloak/data/import/scout-realm.json:ro
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 1g
    healthcheck:
      # The image has no curl; speak HTTP to the management port with bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          timeout 2 cat <&3 | grep -q '"status": "UP"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ── Data stores (internal network only) ───────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [ data ]
    environment:
      POSTGRES_DB: scout
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scout}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    mem_limit: 512m
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U scout -d scout" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # No snapshots: everything in here is a cache, a rate-limit bucket or an approval
  # with a TTL, and losing it on restart fails safe. volatile-lru evicts only keys
  # that have a TTL, which is all of them.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [ data ]
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-scout-dev-redis}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
      - --save
      - ""
    mem_limit: 320m
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG" ]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-scout-dev-redis}

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    restart: unless-stopped
    networks: [ data ]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"   # inside the internal network
      ELASTIC_PASSWORD: ${SCOUT_ELASTICSEARCH_PASSWORD:-scout-dev-es}
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes: [ "esdata:/usr/share/elasticsearch/data" ]
    mem_limit: 1280m
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health | grep -E 'green|yellow'" ]
      interval: 10s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.11.0
    restart: unless-stopped
    networks: [ data ]
    environment:
      QDRANT__SERVICE__API_KEY: ${SCOUT_VECTOR_DB_API_KEY:-scout-dev-qdrant}
    volumes: [ "qdata:/qdrant/storage" ]
    mem_limit: 512m
    healthcheck:
      test: [ "CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'" ]
      interval: 5s
      timeout: 3s
      retries: 20

  # SeaweedFS with its S3 gateway. MinIO stopped publishing images, so this is the
  # S3-compatible store; the tools talk plain S3 and do not care which one is behind it.
  s3:
    image: chrislusf/seaweedfs:3.85
    restart: unless-stopped
    networks: [ data ]
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - >-
        printf '{"identities":[{"name":"scout","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=128
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-scoutaccess}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-scout-dev-s3-secret}
    volumes: [ "s3data:/data" ]
    mem_limit: 512m
    healthcheck:
      # The master binds to the container's own address, not localhost.
      test: [ "CMD-SHELL", "wget -q --spider http://$$(hostname -i):9333/cluster/status" ]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: create the bucket the S3 tools write to.
  s3-init:
    image: scout-mcp:dev
    build: .
    networks: [ data ]
    entrypoint: [ "python", "/init/init_bucket.py" ]
    environment:
      SCOUT_S3_ENDPOINT: http://s3:8333
      SCOUT_S3_BUCKET: scout-mcp-data
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-scoutaccess}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-scout-dev-s3-secret}
      AWS_DEFAULT_REGION: us-east-1
    volumes: [ "./deploy/s3:/init:ro" ]
    depends_on:
      s3: { condition: service_healthy }
    restart: "no"

  # ── Observability ─────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.0
    restart: unless-stopped
    command: [ "--config=/etc/otel/config.yaml" ]
    networks: [ app ]
    volumes:
      - ./deploy/otel/config.yaml:/etc/otel/config.yaml:ro
    depends_on: [ jaeger ]
    mem_limit: 256m

  jaeger:
    image: jaegertracing/all-in-one:1.58
    restart: unless-stopped
    networks: [ app ]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: [ "127.0.0.1:16686:16686" ]
    mem_limit: 256m

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    networks: [ app ]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: [ "127.0.0.1:9090:9090" ]
    mem_limit: 512m
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:9090/-/ready" ]
      interval: 10s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    networks: [ app ]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: [ "127.0.0.1:3000:3000" ]
    depends_on: [ prometheus ]
    mem_limit: 256m
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:3000/api/health" ]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata: {}
  esdata: {}
  qdata: {}
  s3data: {}
  scout-logs: {}
  caddy-data: {}
